site_name: gosr Guide
site_description: Interface and behavioral specifications for Go frameworks and libraries
site_url: !ENV [DOCS_SITE_URL, "https://longxi-go.github.io/gosr/"]
site_author: The longxi-go/gosr Authors
repo_name: longxi-go/gosr
repo_url: https://github.com/longxi-go/gosr
copyright: Copyright &copy; 2026 - present The longxi-go/gosr Authors

validation:
  links:
    anchors: warn

theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/code-braces
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      # Use bundled English search with Han boundaries; avoid a remote tokenizer.
      reconfigure_search: false
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: gosr 使用手册
          site_description: Go 框架与库的接口和行为规范
          nav:
            - 概览: index.md
            - 开始使用:
                - 快速开始: quick-start.md
                - 架构: architecture.md
            - 规范:
                - IoC: contracts/ioc-contracts.md
                - 排序与事件: contracts/events-ordering.md
                - 环境: contracts/environment.md
            - 支持库:
                - 流水线: contracts/pipeline.md
                - 代码生成: contracts/codegen.md
            - 参与开发:
                - 开发指南: development.md
          theme:
            language: zh
  - search:
      lang: en
      separator: '[\s\-]+|(?=[\u4e00-\u9fff])|(?<=[\u4e00-\u9fff])'
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/ecosystem.css

extra:
  generator: false

nav:
  - Overview: index.md
  - Getting Started:
      - Quick Start: quick-start.md
      - Architecture: architecture.md
  - Contracts:
      - IoC: contracts/ioc-contracts.md
      - Ordering and Events: contracts/events-ordering.md
      - Environment: contracts/environment.md
  - Supporting Libraries:
      - Pipeline: contracts/pipeline.md
      - Code Generation: contracts/codegen.md
  - Contributing:
      - Development: development.md
