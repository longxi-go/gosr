name: Release

on:
  push:
    tags: ['v*', 'tools/v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate module tag and release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      module: ${{ steps.release.outputs.module }}
      title: ${{ steps.release.outputs.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate release contract
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          module=root
          flags=()
          if [[ "$RELEASE_TAG" == tools/* ]]; then
            module=tools
            flags+=(--check-root-release --repository "$GITHUB_REPOSITORY")
          fi
          python3 scripts/release.py --module "$module" --tag "$RELEASE_TAG" \
            --github-output "$GITHUB_OUTPUT" "${flags[@]}"

  checks:
    name: Verify exact tagged source
    needs: validate
    uses: ./.github/workflows/quality.yml
    with:
      published_tools: ${{ needs.validate.outputs.module == 'tools' }}

  publish:
    name: Publish GitHub Release
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish maintained English release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TITLE: ${{ needs.validate.outputs.title }}
          RELEASE_MODULE: ${{ needs.validate.outputs.module }}
        run: |
          set -euo pipefail
          latest=false
          if [[ "$RELEASE_MODULE" == root ]]; then
            latest=true
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --latest="$latest" --title "$RELEASE_TITLE" \
            --notes-file "docs/releases/$RELEASE_TAG.md"

  deploy-site:
    name: Deploy released root documentation
    needs: [validate, publish]
    if: needs.validate.outputs.module == 'root'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs-pages.yml
    with:
      release_tag: ${{ github.ref_name }}
